<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas</title>
<meta name="description" content="Recetas de casa: foto, tiempo, dificultad y categoría de un vistazo, filtrables y ordenables.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <h1 class="logo"><a href="#/" class="logo-link"><span class="logo-emoji" aria-hidden="true">🍲</span> Recetas</a></h1>
    <nav class="header-nav" aria-label="Secciones">
      <a href="#/" id="nav-recetas">Recetas</a>
      <a href="#/estacion" id="nav-estacion">De estación</a>
    </nav>
  </div>
</header>

<main class="container">
  <section id="vista-grid">
    <section class="filtros" aria-label="Filtros y orden">
      <div class="filtros-bar" id="filtros-bar">
        <span class="filtros-titulo">
          <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M4.5 8h7M7 12.5h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
          Filtros
        </span>
        <div class="filtros-pills" id="filtros-pills"></div>
        <div class="filtros-menu" id="filtros-menu" role="group" hidden></div>
      </div>

      <div class="resultados-fila">
        <p class="resultado-count" id="resultado-count"></p>
        <a href="#" id="limpiar-filtros" class="limpiar-filtros" hidden>✕ Limpiar filtros (<span id="limpiar-n">0</span>)</a>
        <div class="orden" id="orden">
          <button type="button" class="orden-btn" id="orden-btn" aria-haspopup="true" aria-expanded="false" aria-label="Ordenar">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 13V3M5 3L2.5 5.5M5 3l2.5 2.5M11 3v10M11 13l-2.5-2.5M11 13l2.5-2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            <span class="orden-label" id="orden-label"></span>
          </button>
          <div class="filtros-menu orden-menu" id="orden-menu" role="group" hidden></div>
        </div>
      </div>
    </section>

    <div class="grid" id="grid"></div>
    <p class="estado-vacio" id="estado-vacio" hidden>No hay recetas que coincidan con estos filtros.</p>
  </section>

  <section id="vista-estacion" hidden></section>

  <section id="vista-detalle" hidden>
    <a href="#/" class="volver">← Volver</a>
    <article id="detalle-contenido"></article>
  </section>
</main>

<script src="data/data.js"></script>
<script src="js/estacion.js"></script>
<script src="js/app.js"></script>
</body>
</html>
